<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genius Mind Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
<style>
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 40px}
.top1{text-align:center}
.top1 img{height:68px;width:68px;border-radius:50%;object-fit:cover}
.top1 h1{font-family:'Fredoka',sans-serif;margin:8px 0 2px;font-size:24px}
.top1 p{color:#666;margin:0 0 6px;font-size:14px}
h2.grp{font-family:'Fredoka',sans-serif;font-size:19px;color:var(--plum);margin:22px 0 4px}
.tb{display:flex;align-items:center;gap:14px;padding:18px 16px;margin:12px 0;font-size:18px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:inherit;text-decoration:none;font-weight:800}
.tb .ic{flex:0 0 52px;height:52px;font-size:28px!important;border-radius:10px;background:#f1f3ff;display:flex;align-items:center;justify-content:center;font-size:20px}
.tb .tx{flex:1;min-width:0}
.tb small{display:block;font-weight:600;font-size:12.5px;color:#777;margin-top:2px;line-height:1.3;word-break:break-all}
.tb .lock{font-size:11px;background:#f4effb;color:#6b4a93;border-radius:999px;padding:2px 8px;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
<div class="top1"><img src="logo.png" alt=""><h1>Genius Mind Academy</h1><p>Choose a page 请选择</p></div>
<div id="list"></div>
</div>
<script>
var PAGES = [
  ['📝', 'Booking Trial Class', '预约试课', 'index.html', 'Genius Mind HQ · 1.5 hours'],
  ['🧠', 'Brain Test Date', '脑测报告日期', 'https://puchongjaya.geniusmind.com.my/', 'Genius Mind Puchong Jaya'],
  ['🎡', 'Spin & Win', '转盘赢奖品', 'spin.html', 'After your booking 预约后参加']
];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
document.getElementById('list').innerHTML = PAGES.map(function (p) {
  return '<a class="tb" href="' + esc(p[3]) + '"><span class="ic">' + p[0] + '</span><span class="tx">' + esc(p[1]) + '<br>' + esc(p[2]) + '<small>' + esc(p[4]) + '</small></span><span style="font-size:22px;color:var(--brand)">›</span></a>';
}).join('');
</script>
</body>
</html>
