<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Genius Mind Academy – All pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
<style>
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 40px}
.top1{text-align:center}
.top1 img{height:68px;width:68px;border-radius:50%;object-fit:cover}
.top1 h1{font-family:'Fredoka',sans-serif;margin:8px 0 2px;font-size:24px}
.top1 p{color:#666;margin:0 0 6px;font-size:14px}
h2.grp{font-family:'Fredoka',sans-serif;font-size:19px;color:var(--plum);margin:22px 0 4px}
.tb{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:8px 0;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:inherit;text-decoration:none;font-weight:800}
.tb .ic{flex:0 0 38px;height:38px;border-radius:10px;background:#f1f3ff;display:flex;align-items:center;justify-content:center;font-size:20px}
.tb .tx{flex:1;min-width:0}
.tb small{display:block;font-weight:600;font-size:12.5px;color:#777;margin-top:2px;line-height:1.3;word-break:break-all}
.tb .lock{font-size:11px;background:#f4effb;color:#6b4a93;border-radius:999px;padding:2px 8px;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
<div class="top1"><img src="logo.png" alt=""><h1>Genius Mind Academy</h1><p>All landing pages 所有着陆页</p></div>
<div id="list"></div>
</div>
<script>
var PJ = 'https://puchongjaya.geniusmind.com.my/';
var GROUPS = [
  ['HQ 总部 – booking.geniusmind.com.my', [
    ['📝', 'Trial Class booking 试课预约', 'index.html', 'For parents 家长用'],
    ['🎡', 'Spin & Win 转盘', 'spin.html', 'For parents after booking 预约后家长用'],
    ['📅', 'Booking calendar 预约日历', 'calendar.html', '', 1],
    ['🗓️', 'Open dates 开放日期', 'availability.html', '', 1],
    ['⚙️', 'Settings 设置', 'settings.html', '', 1],
    ['☰', 'Teacher menu 老师菜单', 'teachers.html', '']
  ]],
  ['Puchong Jaya 分行 – puchongjaya.geniusmind.com.my', [
    ['📝', 'Parent booking 家长预约', PJ, 'For parents 家长用'],
    ['🎟️', 'Spin & Win registration 转盘登记', PJ + 'luckydraw.html', 'For parents 家长用'],
    ['🎡', 'Spin & Win prize record 转盘奖品登记', PJ + 'staff.html', '', 1],
    ['📅', 'Booking calendar 预约日历', PJ + 'calendar.html', '', 1],
    ['🗓️', 'Open dates 开放日期', PJ + 'availability.html', '', 1],
    ['⚙️', 'Settings 设置', PJ + 'settings.html', '', 1],
    ['☰', 'Teacher menu 老师菜单', PJ + 'teachers.html', '']
  ]]
];
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
document.getElementById('list').innerHTML = GROUPS.map(function (g) {
  return '<h2 class="grp">' + esc(g[0]) + '</h2>' + g[1].map(function (p) {
    var full = /^https?:/.test(p[2]) ? p[2] : new URL(p[2], location.href).href;
    return '<a class="tb" href="' + esc(p[2]) + '"><span class="ic">' + p[0] + '</span><span class="tx">' + esc(p[1]) +
      '<small>' + (p[3] ? esc(p[3]) + ' · ' : '') + esc(full.replace(/^https:\/\//, '')) + '</small></span>' + (p[4] ? '<span class="lock">🔒 password</span>' : '') + '</a>';
  }).join('');
}).join('');
</script>
</body>
</html>
